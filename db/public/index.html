<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header>
  <div class="brand">
    <h1 id="store-name">Carregando...</h1>
    <p id="store-tagline"></p>
  </div>
  <div class="header-actions">
    <a class="link-btn" href="/admin.html">painel admin</a>
    <button id="cart-toggle" aria-label="Abrir carrinho">
      🧺 Carrinho <span id="cart-count">0</span>
    </button>
  </div>
</header>

<div class="hero">
  <div class="eyebrow">// vitrine</div>
  <h2>Adicione produtos no painel admin — eles aparecem aqui na hora.</h2>
</div>

<main>
  <div id="grid"></div>
</main>

<footer>feito para vender — dados salvos em banco SQLite no servidor</footer>

<div id="overlay"></div>
<aside id="cart" aria-label="Carrinho de compras">
  <div id="cart-header">
    <h2>Sua sacola</h2>
    <button id="close-cart" aria-label="Fechar carrinho">✕</button>
  </div>
  <div id="cart-items"></div>
  <div id="cart-footer">
    <div id="cart-total"><span>Total</span><span id="total-value">R$ 0,00</span></div>
    <button id="checkout-btn" disabled>Finalizar pelo WhatsApp</button>
    <p id="checkout-note">Você será redirecionado ao WhatsApp com o pedido pronto para enviar.</p>
  </div>
</aside>

<script src="/js/store.js"></script>
</body>
</html>
