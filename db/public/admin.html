<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Admin — Loja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header>
  <div class="brand">
    <h1>Painel Admin</h1>
    <p>gerencie produtos e configurações da loja</p>
  </div>
  <div class="header-actions">
    <a class="link-btn" href="/index.html">ver loja</a>
  </div>
</header>

<div class="admin-wrap">

  <section class="panel">
    <h2>Configurações da loja</h2>
    <form id="settings-form">
      <div class="field">
        <label for="store_name">Nome da loja</label>
        <input type="text" id="store_name" name="store_name" required>
      </div>
      <div class="field">
        <label for="tagline">Slogan</label>
        <input type="text" id="tagline" name="tagline">
      </div>
      <div class="field">
        <label for="whatsapp_number">WhatsApp (DDI+DDD+número, só números)</label>
        <input type="text" id="whatsapp_number" name="whatsapp_number" placeholder="5511999999999" required>
      </div>
      <button class="submit-btn" type="submit">Salvar configurações</button>
    </form>
  </section>

  <section class="panel">
    <h2>Adicionar produto</h2>
    <form id="product-form">
      <div class="field">
        <label for="name">Nome do produto</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div class="field">
        <label for="description">Descrição</label>
        <textarea id="description" name="description"></textarea>
      </div>
      <div class="field">
        <label for="price">Preço (ex: 49.90)</label>
        <input type="number" step="0.01" min="0" id="price" name="price" required>
      </div>
      <div class="field">
        <label for="image">Foto do produto</label>
        <input type="file" id="image" name="image" accept="image/*">
      </div>
      <button class="submit-btn" type="submit">Adicionar produto</button>
    </form>
  </section>

  <section class="panel">
    <h2>Produtos cadastrados</h2>
    <div class="admin-list" id="admin-list"></div>
  </section>

</div>

<script src="/js/admin.js"></script>
</body>
</html>
